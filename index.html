м жизни",explanation:"Дуб (А) и мухомор (В) — оба ведут прикреплённый образ жизни, не перемещаются. Волк (Б) — животное, активный, подвижный."},{subId:"1.3",type:"characteristics",question:"В приведённом ниже списке даны характеристики объектов живой природы. Все они, за исключением одной, относятся к характеристикам объекта, изображённого в задании 1.1 над буквой Б. Выпишите эту характеристику, которая «выпадает» из общего ряда. Объясните свой выбор.",characteristics:["Ограниченный рост","Прикреплённый образ жизни","Клеточное строение","Половое размножение"],correctOutlier:"Прикреплённый образ жизни",keywords:["подвижный","не прикреплён","перемещение","активный","миграция","животное перемещается"],focusLetter:"Б",explanation:"Объект над Б — волк, царство Животные. Для животных НЕ характерен прикреплённый образ жизни — они подвижны."}]},De={id:"3_1",line:"3",lineTitle:"Линия 3",type:"choose_two",question:"Различают практические и теоретические методы исследования. Выберите из приведённого ниже списка два практических метода.",options:["обобщение","наблюдение","описание","сравнение","измерение"],correct:[1,4],points:2,explanation:"Практические методы — наблюдение и измерение, они связаны с непосредственным изучением объекта. Обобщение, описание и сравнение — теоретические/аналитические."},to={id:"block_2",line:"2",lineTitle:"Линия 2",type:"block_2",tasks:[{subId:"2.1",type:"choice_with_list",question:"Во время дыхания у человека поднимается и опускается грудная клетка. Найдите в приведённом ниже списке и запишите название этого процесса.",characteristics:["Рост","Фотосинтез","Движение","Выделение"],correct:"Движение",points:1,explanation:"Поднятие и опускание грудной клетки — это движение, связанное с дыханием."},{subId:"2.2",type:"free_text_ai",question:"В чём заключается значение описанного в задании 2.1 процесса для человека?",keywords:["кислород","дыхание","газообмен","энергия","жизнь","воздух","лёгкие","вдох","выдох"],points:1,explanation:"Движение грудной клетки обеспечивает вдох и выдох, поступление кислорода и удаление углекислого газа."}]},no={id:"block_4",line:"4",lineTitle:"Линия 4",type:"block_4",image:{url:xt.fox,alt:"Лисица обыкновенная",letter:null},tasks:[{subId:"4.1",type:"free_text",question:"Перед Вами изображение лисицы обыкновенной. В каких природных сообществах обитает это животное? Укажите название одного из этих сообществ.",correctAnswers:["лес","лесостепь","степь","тундра","смешанный лес","хвойный лес","широколиственный лес"],keywords:["лес","степь","тундра","поле","лесостепь"],points:1,explanation:"Лисица обитает в лесу, лесостепи, степи, тундре. Приспособления: густой мех, острый слух, маскировочная окраска"},{subId:"4.2",type:"free_text_ai",question:"Напишите название одного животного, которое обитает в сообществе вместе с лисицей.",correctAnswers:["заяц","волк","медведь","мышь","белка","лось","кабан","ёж","барсук","лиса"],keywords:["заяц","волк","мышь","белка","лось","кабан","медведь","ёж","барсук","олень","лисица"],points:1,explanation:"В лесу вместе с лисицей обитают заяц, волк, медведь, белка, мышь и др. - они связаны пищевыми цепями"}]},hS={id:"block_5",line:"5",lineTitle:"Линия 5",type:"block_5",tasks:[{subId:"5.1",type:"choose_three",question:"Прочитайте текст и выполните задание.",text:"(1) Внешне амёба протей напоминает маленький студенистый комочек. (2) Передвигаясь, амёба медленно как бы перетекает по дну. (3) Самостоятельный одноклеточный организм амёбы состоит из цитоплазмы, покрытой клеточной мембраной. (4) Амёба дышит растворённым в воде кислородом, который проникает внутрь через всю поверхность тела. (5) В теле амёбы можно различить ядро, пищеварительные и сократительную вакуоли. (6) Размножается амёба бесполым путём. В каких предложениях текста описываются признаки, на основе которых можно сделать вывод о том, что амёба не является многоклеточным животным?",options:["1) Внешне амёба протей напоминает маленький студенистый комочек","2) Передвигаясь, амёба медленно как бы перетекает по дну","3) Самостоятельный одноклеточный организм амёбы состоит из цитоплазмы, покрытой клеточной мембраной","4) Амёба дышит растворённым в воде кислородом, который проникает внутрь через всю поверхность тела","5) В теле амёбы можно различить ядро, пищеварительные и сократительную вакуоли","6) Размножается амёба бесполым путём"],correct:[2,4,5],points:2,explanation:"Признаки одноклеточности: (3) самостоятельный одноклеточный организм, (5) в теле можно различить органоиды одной клетки — ядро и вакуоли, (6) размножается делением одной клетки бесполым путём."},{subId:"5.2",type:"two_questions_with_image",image:{url:xt.fox,alt:"Лисица обыкновенная"},text:"(1) Лисица обыкновенная — хищное животное, широко распространённое на территории Евразии, Северной Америки. (2) Лисица — зверь среднего размера, массой до 10 кг, с изящным туловищем на невысоких тонких лапах, с вытянутой мордой, острыми ушами и длинным пушистым хвостом. (3) Самки лисицы рождают живых детёнышей и выкармливают их молоком. (4) Мех у лисицы густой, длинный, рыжего цвета, хорошо удерживающий тепло, поэтому зверь издавна был объектом охотничьего промысла. (5) Лисицы, в отличие от волков, охотятся на мелких животных, в основном на мышей, однако вблизи человеческого жилья могут нападать на домашнюю птицу. (6) В дикой природе лисицы редко живут более семи лет.",questions:[{id:"A",question:"А) Какую среду обитания освоила лисица?",correct:["наземно-воздушная","наземная","лес","лесостепь"],keywords:["наземно","наземная","суша","лес","наземно-воздушная"],points:1},{id:"B",question:"Б) Густая шерсть — это приспособление к жизни в определённых условиях среды. В каких именно?",correct:["холод","низкие температуры","зима","сохранение тепла","мороз"],keywords:["холод","тепло","температур","зим","мороз","сохран"],points:1}],points:2,explanation:"А) Наземно-воздушная среда, наземная, лесная. Б) Приспособление к холодным условиям, низким температурам, для сохранения тепла зимой."}]},LS={id:"line_6_1",line:"6",lineTitle:"Ли
